[project]
name = "byte-size-travel"
version = "0.1.0"
description = "AI Generated Travel Newsletter"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Johnathan Oneal", email = "johmathanoneal@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "boto3",
    "feedparser",
    "markdown",
    "openai",
    "pydantic[email]",
    "python-dotenv",
    "pyyaml",
    "requests",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: marks tests that require network access (deselect with '-m \"not network\"')",
]
